<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAO Furniture - 3D Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css?family=Object+Sans:400,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
  <div class="subtitle-text" id="subtitle-trigger">Furniture Studio Woodworking School Tbilisi, Georgia.</div>

  <!-- Overlay Menu -->
  <div class="overlay-menu" id="overlay-menu">
    <div class="overlay-content">
      <div class="menu-items">
        <a href="index.html" class="menu-item">Home</a>
        <a href="about.html" class="menu-item">About</a>
        <a href="projects.html" class="menu-item">Project</a>
        <a href="#" class="menu-item">Contact</a>
      </div>
      <button class="overlay-close" id="overlay-close">×</button>
    </div>
  </div>

  <!-- 3D Model Canvas -->
  <canvas id="threejs-canvas"></canvas>

  <!-- Control Panel -->
  <div class="control-panel" id="controlPanel">
    <div class="control-header">
      <h3>3D Controls</h3>
      <button class="toggle-btn" id="toggleControls">×</button>
    </div>
    
    <div class="control-section">
      <h4>Camera Position</h4>
      <div class="control-group">
        <label>X: <input type="range" id="cameraX" min="-10" max="10" step="0.1" value="0"></label>
        <label>Y: <input type="range" id="cameraY" min="-10" max="10" step="0.1" value="0"></label>
        <label>Z: <input type="range" id="cameraZ" min="0.5" max="10" step="0.1" value="2"></label>
      </div>
    </div>
    
    <div class="control-section">
      <h4>Model Position</h4>
      <div class="control-group">
        <label>X: <input type="range" id="modelX" min="-0.8" max="10" step="0.1" value="0"></label>
        <label>Y: <input type="range" id="modelY" min="-10" max="10" step="0.1" value="0"></label>
        <label>Z: <input type="range" id="modelZ" min="-10" max="10" step="0.1" value="0"></label>
      </div>
    </div>
    
    <div class="control-section">
      <h4>Model Rotation</h4>
      <div class="control-group">
        <label>X: <input type="range" id="rotationX" min="-3.14" max="3.14" step="0.01" value="0"></label>
        <label>Y: <input type="range" id="rotationY" min="-3.14" max="3.14" step="0.01" value="0"></label>
        <label>Z: <input type="range" id="rotationZ" min="-3.14" max="3.14" step="0.01" value="0"></label>
      </div>
    </div>
    
    <div class="control-section">
      <h4>Model Scale</h4>
      <div class="control-group">
        <label>Scale: <input type="range" id="modelScale" min="0.1" max="5" step="0.01" value="1"></label>
      </div>
    </div>
    
    <div class="control-section">
      <h4>State Management</h4>
      <div class="state-buttons">
        <button class="state-btn" id="copyState">📋 Copy State</button>
        <button class="state-btn" id="pasteState">📥 Paste State</button>
      </div>
      <textarea class="state-input" id="stateInput" placeholder="Paste state JSON here..."></textarea>
    </div>
    
    <button class="reset-btn" id="resetControls">Reset All</button>
  </div>

  <!-- Toggle Button (shown when panel is hidden) -->
  <button class="control-toggle" id="controlToggle">⚙️</button>

  <!-- Loading Animation (hidden after model loads) -->
  <div class="loader">
    <h1 id="loader-text">.KAO FURNITURE</h1>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/script.js?v=8"></script>
</body>
</html>
